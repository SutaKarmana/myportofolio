{% extends 'base.html' %}
{% load static %}
{% block content %}
<main><section class="section" id="awards"><div class="container">
    <div class="section-heading">
        <h2>Awards</h2>
        {% if user.is_superuser %}<button class="button" popovertarget="add-award-modal">Tambah Penghargaan</button>{% endif %}
    </div>
    <form id="award-search-form" class="project-search" role="search" aria-label="Pencarian penghargaan">
        <input type="search"
               id="award-search"
               name="q"
               placeholder="Cari berdasarkan nama penghargaan"
               class="project-search__input"
               aria-label="Cari berdasarkan nama penghargaan">
        <button type="submit" class="button">Cari</button>
    </form>
    <div id="award-app" data-endpoint="{% url 'main:get_awards_json' %}"
         data-can-edit="{% if user.is_superuser or perms.main.change_award %}true{% else %}false{% endif %}"
         data-can-delete="{{ user.is_superuser|yesno:'true,false' }}">
        <form id="award-csrf" hidden>{% csrf_token %}</form>
        <p id="award-status" role="status" aria-live="polite">Memuat penghargaan…</p>
        <div id="award-grid" class="awards-grid"></div>
    </div>
    {% if user.is_superuser %}
    <div id="add-award-modal" class="project-form-modal" popover="auto" role="dialog" aria-labelledby="award-modal-title">
        <button class="project-form-modal__backdrop" popovertarget="add-award-modal" popovertargetaction="hide" aria-label="Tutup"></button>
        <div class="project-form-modal__content">
            <h2 id="award-modal-title">Tambah Penghargaan</h2>
            <form id="award-form" method="post" action="{% url 'main:create_award_ajax' %}" class="project-form">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}</div>
                {% endfor %}
                <p id="award-form-errors" role="alert"></p>
                <div class="project-form-modal__actions">
                    <button type="button" class="button button-secondary" popovertarget="add-award-modal" popovertargetaction="hide">Batal</button>
                    <button type="submit" class="button">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    {% endif %}
</div></section></main>
<script src="{% static 'js/awards.js' %}?v=2" defer></script>
{% endblock content %}
