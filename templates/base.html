{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    {% block meta %} {% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="#profile" class="brand">{{ name }}</a>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a class="{% if request.resolver_match.url_name == 'show_main' %}is-active{% endif %}" href="{% url 'main:show_main' %}">Profile</a></li>
                    <li><a class="{% if request.resolver_match.url_name == 'show_education' %}is-active{% endif %}" href="{% url 'main:show_education' %}">Education</a></li>
                    <li><a class="{% if request.resolver_match.url_name == 'show_experience' %}is-active{% endif %}" href="{% url 'main:show_experience' %}">Experience</a></li>
                    <li><a class="{% if request.resolver_match.url_name == 'show_awards' %}is-active{% endif %}" href="{% url 'main:show_awards' %}">Awards</a></li>
                    <li><a class="{% if request.resolver_match.url_name == 'show_projects' %}is-active{% endif %}" href="{% url 'main:show_projects' %}">Projects</a></li>
                </ul>
            </nav>
        </div>
    </header>
    {% block content %} {% endblock content %}
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
    <!-- AOS memberi animasi ringan saat konten muncul di layar. -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
