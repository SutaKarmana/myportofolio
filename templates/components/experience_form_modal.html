<div id="add-experience-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="add-experience-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-experience-modal" popovertargetaction="hide" aria-label="Tutup modal"></button>
    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pengalaman">&times;</button>
        <h2 id="add-experience-title">Tambah Pengalaman</h2>
        <form id="experience-form" method="post" action="{% url 'api:experience-list' %}" class="project-form" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group" data-field-name="{{ field.name }}">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
                <p class="form-error" data-error-for="{{ field.name }}" id="experience-error-{{ field.name }}" aria-live="polite"></p>
            </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-experience-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Pengalaman</button>
            </div>
        </form>
    </div>
</div>
